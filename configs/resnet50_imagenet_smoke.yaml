## =============================================================================
## ResNet50 — ImageNet smoke-test config
## =============================================================================
##
## Purpose: exercise the full training pipeline (data stream, model init,
## forward/backward, checkpoint save) in a few minutes so pipeline bugs
## surface before committing a 30h A100 job to the queue.
##
## NOT intended to produce a usable model — loss/accuracy will be random.
## =============================================================================

## ---TRAINING MODE--- ##
training_mode: scratch

## ---PATHS--- ##
save_path: "/home/jenkm22/perturbations/training_runs/resnet50_imagenet_smoke"

## ---HF STREAMING--- ##
stream_from_hf: true
hf_dataset_name: "ILSVRC/imagenet-1k"
hf_cache_dir: "/tmp/hf_cache"
num_train_samples: 256
num_val_samples: 128
hf_shuffle_buffer_size: 256

## ---LOGGING & W&B--- ##
wandb_project:
wandb_entity:
debug_logging: false
logger: None
debug_resume: false

## ---TRAINING PARAMETERS--- ##
dataset_type: imagenet
max_duration: 1
early_stopping_patience: 1
batch_size: 16
criterion: CrossEntropyLoss
random_seed: 1
cuda: 0
num_workers: 2
prefetch_factor: 2

## ---OPTIMIZER & LR SCHEDULE--- ##
opt: sgd
lr: 0.1
momentum: 0.9
weight_decay: 1e-4
lr_scheduler: cosineannealinglrwithwarmup
lr_warmup_duration: 1

## ---PERTURBATION PARAMETERS--- ##
perturb_type: none
perturb_epoch:
perturb_length:
perturb_seed:

## ---MODEL--- ##
architecture: RN50
pretrained: false
num_classes: 1000

## ---RSA PARAMETERS--- ##
behavioral_rsa: false
