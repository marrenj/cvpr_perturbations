## =============================================================================
## ResNet50 — ImageNet DEBUG config (2 epochs)
## =============================================================================
##
## Purpose: verify the ImagenetHFStreamDataset truncation fix. After the fix,
## each epoch should traverse all ~5005 train batches and ~196 val batches.
##
## Entry point:
##   sbatch resnet50_imagenet_debug.slurm
## =============================================================================

## ---TRAINING MODE--- ##
training_mode: scratch

## ---PATHS--- ##
save_path: "./training_runs/resnet50_imagenet_debug"

## ---HF STREAMING--- ##
stream_from_hf: true
hf_dataset_name: "ILSVRC/imagenet-1k"
hf_cache_dir: "/tmp/hf_cache"
num_train_samples: 1281167
num_val_samples: 50000
hf_shuffle_buffer_size: 10000

## ---LOGGING & W&B--- ##
wandb_project:
wandb_entity:
debug_logging: true
logger: None
debug_resume: false

## ---TRAINING PARAMETERS--- ##
dataset_type: imagenet
max_duration: 2
early_stopping_patience: 2
batch_size: 256
criterion: CrossEntropyLoss
random_seed: 1
cuda: -1
num_workers: 8
prefetch_factor: 4

## ---OPTIMIZER & LR SCHEDULE--- ##
opt: sgd
lr: 0.1
momentum: 0.9
weight_decay: 1e-4
lr_scheduler: cosineannealinglrwithwarmup
lr_warmup_duration: 1

## ---PERTURBATION PARAMETERS--- ##
perturb_type: none
perturb_epoch:
perturb_length:
perturb_seed:

## ---MODEL--- ##
architecture: RN50
pretrained: false
num_classes: 1000

## ---RSA PARAMETERS--- ##
# Disabled for debug — orthogonal to the data-truncation fix we're verifying.
behavioral_rsa: False
